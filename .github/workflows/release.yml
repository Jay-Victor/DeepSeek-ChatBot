name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web bundle
        working-directory: web
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm type
          pnpm build

      - name: Sync assets
        run: |
          set -euo pipefail
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r web/dist/. android/app/src/main/assets/www/

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 不用 android-actions/setup-android@v3：它会执行 `sdkmanager tools`，而 Google 已下架该
      # 旧包，整步直接失败。runner 自带 SDK，这里只定位路径并按需补装平台/构建工具。
      - name: Locate Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::找不到 Android SDK（$SDK）"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk: $SDK"
          ls "$SDK"

      - name: Install SDK packages
        run: |
          set +o pipefail
          SDKMANAGER=$(find "${ANDROID_SDK_ROOT}/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::warning::没找到 sdkmanager，交给 AGP 自动下载缺失组件"
            exit 0
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.1.0" \
            || echo "::warning::sdkmanager 安装失败，交给 AGP 自动下载"
          ls "${ANDROID_SDK_ROOT}/platforms" 2>/dev/null || true
          ls "${ANDROID_SDK_ROOT}/build-tools" 2>/dev/null || true

      - name: Restore keystore and signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::缺少 KEYSTORE_BASE64 secret，无法签名（见 AGENTS.md 第 7 节）"
            exit 1
          fi
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks
          {
            echo "sdk.dir=${ANDROID_SDK_ROOT}"
            echo "KEYSTORE_FILE=${GITHUB_WORKSPACE}/android/keystore/release.jks"
            echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}"
            echo "KEYSTORE_ALIAS=${KEYSTORE_ALIAS}"
            echo "KEY_PASSWORD=${KEY_PASSWORD}"
          } > android/local.properties

      - name: Verify versionName matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -m1 'versionName' android/app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="${GITHUB_REF_NAME#v}"
          echo "versionName=$VERSION_NAME tag=$TAG"
          if [ "$VERSION_NAME" != "$TAG" ]; then
            echo "::error::versionName ($VERSION_NAME) 与 tag ($TAG) 不一致，先改版本号再打 tag"
            exit 1
          fi

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        id: apk
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          sha256sum "$APK" | tee apk.sha256
          stat -c%s "$APK" | tee apk.size

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.ref_name }}
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 30

      - name: Compose release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" /tmp/notes.md
          else
            {
              echo "把 [deepseek-ai/chat-demo](https://github.com/deepseek-ai/chat-demo) 打包的 Android 版本 ${GITHUB_REF_NAME}。"
              echo
              echo "## 安装"
              echo
              echo '```bash'
              echo "adb install -r $(basename "${{ steps.apk.outputs.apk }}")"
              echo '```'
              echo
              echo "首次启动在「设置 → 数据管理」填入自己的 DeepSeek API Key；Key 只存本机，不进云备份。"
            } > /tmp/notes.md
          fi
          if ! grep -q 'SHA-256' /tmp/notes.md; then
            {
              echo
              echo "## 校验"
              echo
              echo '```'
              echo "SHA-256  $(cut -d' ' -f1 apk.sha256)"
              echo "size     $(cat apk.size) bytes"
              echo '```'
            } >> /tmp/notes.md
          fi
          cat /tmp/notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          TITLE="DeepSeek ChatBot $TAG"
          APK="${{ steps.apk.outputs.apk }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file /tmp/notes.md
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" --title "$TITLE" --notes-file /tmp/notes.md --latest "$APK"
          fi
          gh release view "$TAG" --json tagName,name,isDraft,assets --jq '{tag:.tagName,name:.name,draft:.isDraft,assets:[.assets[]|{name,size,state}]}'
